services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: anirok-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Anirok_dev_2026!}"
    ports:
      - "1433:1433"
    volumes:
      - anirok-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Anirok_dev_2026!}"
    volumes:
      - "./database anirok:/scripts:ro"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        if /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -h -1 -W -Q "SET NOCOUNT ON; IF DB_ID(N'anirok2') IS NOT NULL SELECT 1" | grep -q 1; then
          echo "La base anirok2 ya existe; no se vuelve a inicializar."
        else
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i "/scripts/scriptsqlserver.txt"
        fi
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -d anirok2 -i "/scripts/migrations.sql"
    restart: "no"

volumes:
  anirok-sqlserver-data:
